<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>datafetch — vendor-risk · carousel</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0a0a0a">
<link rel="icon" type="image/svg+xml" href="assets/favicon-mark.svg">
<link rel="stylesheet" href="colors_and_type.css">
<link rel="stylesheet" href="carousel.css">

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
</head>
<body data-theme="dark">
  <div id="app"></div>
  <div id="tweaks-root"></div>

  <script type="text/babel" src="tweaks-panel.jsx"></script>
  <script type="text/babel" src="file-contents.jsx"></script>
  <script type="text/babel" src="carousel.jsx"></script>

  <script type="text/babel">
    const TWEAK_DEFAULTS = /*EDITMODE-BEGIN*/{
      "theme": "light"
    }/*EDITMODE-END*/;

    function App() {
      return <window.Carousel />;
    }

    function TweaksApp() {
      const [tweaks, setTweak] = window.useTweaks(TWEAK_DEFAULTS);

      React.useEffect(() => {
        const t = tweaks.theme || 'dark';
        document.body.setAttribute('data-theme', t);
        try { localStorage.setItem('df.theme', t); } catch (_) {}
        const btn = document.getElementById('theme-btn');
        if (btn) btn.textContent = t === 'dark' ? '◐ light' : '◑ dark';
      }, [tweaks.theme]);

      // Reflect chrome-button toggles back into the tweaks state.
      React.useEffect(() => {
        const onTheme = (e) => {
          if (e.detail !== tweaks.theme) setTweak('theme', e.detail);
        };
        window.addEventListener('df-theme', onTheme);
        return () => window.removeEventListener('df-theme', onTheme);
      }, [tweaks.theme]);

      return (
        <window.TweaksPanel title="Tweaks">
          <window.TweakSection label="Theme">
            <window.TweakRadio
              label="Mode"
              value={tweaks.theme}
              options={['dark', 'light']}
              onChange={(v) => setTweak('theme', v)}
            />
          </window.TweakSection>
        </window.TweaksPanel>
      );
    }

    // Wire the chrome theme button (delegated since it's inside the React tree).
    document.addEventListener('click', (e) => {
      const btn = e.target && e.target.closest && e.target.closest('#theme-btn');
      if (!btn) return;
      const cur = document.body.getAttribute('data-theme') || 'dark';
      const next = cur === 'dark' ? 'light' : 'dark';
      document.body.setAttribute('data-theme', next);
      try { localStorage.setItem('df.theme', next); } catch (_) {}
      btn.textContent = next === 'dark' ? '◐ light' : '◑ dark';
      window.dispatchEvent(new CustomEvent('df-theme', { detail: next }));
    });

    // Apply persisted theme as soon as possible.
    (function () {
      let t = TWEAK_DEFAULTS.theme || 'dark';
      try { t = localStorage.getItem('df.theme') || t; } catch (_) {}
      document.body.setAttribute('data-theme', t);
    })();

    function tryMount() {
      const readyApp = typeof window.Carousel === 'function';
      const readyTweaks = typeof window.TweaksPanel === 'function' && typeof window.useTweaks === 'function';
      const readyFiles = typeof window.renderFile === 'function';
      if (!readyApp || !readyTweaks || !readyFiles) return setTimeout(tryMount, 50);
      ReactDOM.createRoot(document.getElementById('app')).render(<App />);
      ReactDOM.createRoot(document.getElementById('tweaks-root')).render(<TweaksApp />);
      // Set the button text to match current theme after first render.
      requestAnimationFrame(() => {
        const btn = document.getElementById('theme-btn');
        const cur = document.body.getAttribute('data-theme') || 'dark';
        if (btn) btn.textContent = cur === 'dark' ? '◐ light' : '◑ dark';
      });
    }
    tryMount();
  </script>
</body>
</html>
