arms:
  - id: skillcraft-base
    runner: native-skillcraft
    skillcraft_mode: base
    primary: true
  - id: skillcraft-skill
    runner: native-skillcraft
    skillcraft_mode: skill
    primary: true
  - id: datafetch-learned
    runner: datafetch
    primary: true
    scoring: official-skillcraft-evaluator
  - id: datafetch-control
    runner: datafetch
    primary: true
    scoring: official-skillcraft-evaluator
    # P1 matched-arm control: same harness, prompt, df.d.ts skeleton,
    # df.tool surface, df.db.records mount, and per_entity seed as
    # datafetch-learned. Differs only in the learning loop: no
    # hydrateFamilyLibCache, no installObserver, no persistFamilyLibCache.
    # Invocation: DATAFETCH_DISABLE_LEARNING=1 pnpm eval:skillcraft -- --live ...
    env:
      DATAFETCH_DISABLE_LEARNING: "1"
  - id: skillcraft-static-reuse
    runner: native-skillcraft
    skillcraft_mode: static-reuse
    primary: false

primary_contrasts:
  - datafetch-learned vs skillcraft-base
  - datafetch-learned vs skillcraft-skill
  - datafetch-learned vs datafetch-control

